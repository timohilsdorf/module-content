name: Module prüfen & Deployment

on:
  pull_request:
  push:
    branches: [main]

# Der Workflow braucht nur Lesezugriff – explizit festgeschrieben, damit
# eine spätere Änderung der Repo-Standardrechte nichts aufweicht (die
# PR-Validierung führt Code aus dem PR-Stand aus).
permissions:
  contents: read

jobs:
  # Sicherheitsnetz: läuft bei jedem Pull Request und markiert ihn bei
  # Verstössen als fehlgeschlagen. Geprüft wird alles aus schema/validate.ts
  # (Schema, erlaubte Blocktypen, Video-/Bild-Whitelist, kein Roh-HTML,
  # Bild-Existenz/-Grösse, IDs, Ordnerhygiene).
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keine Git-Credentials im Arbeitsverzeichnis zurücklassen –
          # der validierte Inhalt stammt aus dem PR und ist fremder Code.
          persist-credentials: false
          # Volle Historie: Die Fassungs-Prüfung vergleicht bei PRs
          # gegen die Basis (UEBERSETZUNG_BASIS), um «Fassung gegen
          # veralteten Master erzeugt» von normaler Veraltung zu
          # unterscheiden.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TypeScript-Typecheck über Validator/Übersetzungs-Werkzeug –
      # fängt kaputte Änderungen an schema/ und uebersetzung/, BEVOR
      # der Validator sie zur Laufzeit trifft. Der Byteidentitäts-
      # Abgleich der Schema-KOPIEN läuft dagegen bewusst NICHT hier,
      # sondern in der CI des (privaten) Plattform-Repos everycate
      # («Schema-Drift prüfen» in dessen validate.yml) – dieses Repo
      # hält keinen Zugriffs-Token auf die private Kopie.
      - name: Typecheck
        run: npx tsc --noEmit
      # Unit-Nachweis der Übersetzungs-Verdrahtung (Diagramm-Labels,
      # Untertitel-Texte, maskierter Struktur-Vergleich).
      - name: Übersetzungs-Unit-Tests
        run: npm run test:uebersetzung
      - name: Module validieren
        env:
          # PR-Basis für die Änderungslisten-Regel der Sprachfassungen
          # (uebersetzung/pruefung.ts); bei push auf main leer.
          # origin/<base_ref> statt event.pull_request.base.sha: Die
          # Event-Payload veraltet, sobald andere PRs mergen, und würde
          # fremde, bereits gemergte Fassungen als «im PR geändert»
          # melden (Review-Fund 18.8.2026); origin/<base> ist beim
          # fetch-depth-0-Checkout frisch, und git diff base...HEAD auf
          # dem Merge-Commit liefert exakt die PR-Änderungen.
          UEBERSETZUNG_BASIS: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          # GitHubs Standard-Shell für run: ist `bash -e` OHNE pipefail –
          # ohne die nächste Zeile würde der Exit-Code des Validators vom
          # tee verschluckt und der Check wäre trotz Fehlern grün.
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run validate 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" && status=0 || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
      - name: Übersetzungs-Status
        # Nachführungsliste (Matrix Modul × Sprache) in die
        # Zusammenfassung – informativ, macht den Lauf nie rot.
        run: npm run uebersetzungs-status || true

  # Nach einem Merge auf main: Vercel-Build der Plattform anstossen –
  # ein neues Modul geht live, ohne dass sich am Plattform-Repo etwas
  # ändert. Läuft bewusst erst NACH grüner Validierung, damit kaputter
  # Content gar nie ein Deployment auslöst. (Schlägt der Plattform-Build
  # dennoch fehl, bleibt auf Vercel die letzte funktionierende Version
  # live.)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Vercel Deploy Hook aufrufen
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          # Paste-Artefakte entfernen (Anführungszeichen, Zeilenumbrüche,
          # Leerzeichen) – eine Deploy-Hook-URL enthält nichts davon.
          HOOK=$(printf '%s' "$HOOK" | tr -d '[:space:]' | sed -e "s/^[\"']//" -e "s/[\"']\$//")
          if [ -z "$HOOK" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK fehlt – in Settings → Secrets and variables → Actions hinterlegen (URL aus Vercel: Settings → Git → Deploy Hooks)."
            exit 1
          fi
          case "$HOOK" in
            https://*) ;;
            *)
              echo "::error::Secret VERCEL_DEPLOY_HOOK ist keine https-URL – bitte die Deploy-Hook-URL aus Vercel (Settings → Git → Deploy Hooks) neu als Secret setzen."
              exit 1
              ;;
          esac
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy Hook ausgelöst – Vercel baut die Plattform mit dem neuen Content." >> "$GITHUB_STEP_SUMMARY"
